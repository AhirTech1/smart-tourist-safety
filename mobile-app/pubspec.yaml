name: smart_tourist_safety_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  google_fonts: ^4.0.4       # ✅ downgraded
  flutter_svg: ^1.1.6        # ✅ downgraded
  http: ^0.13.6              # ✅ compatible with google_place
  google_maps_flutter: ^2.7.0
  geolocator: ^14.0.2
  url_launcher: ^6.2.5
  google_place: ^0.4.7       # ✅ instead of google_maps_webservice

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  generate: true

flutter-gen:
  output: lib/gen/
